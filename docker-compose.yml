# ══════════════════════════════════════════════════════════════════
# RevRec — Local Development Infrastructure
# Runs PostgreSQL and Redis for local development.
#
# Usage:
#   docker compose up -d        → Start in background
#   docker compose down         → Stop containers
#   docker compose down -v      → Stop and WIPE all data (clean reset)
#   docker compose logs -f      → Stream logs
# ══════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: revrec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: revrec_user
      POSTGRES_PASSWORD: revrec_pass
      POSTGRES_DB: revrec_db
    ports:
      - "5432:5432"
    volumes:
      # Named volume ensures data persists across container restarts.
      # Use 'docker compose down -v' to wipe data for a clean test run.
      - revrec_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revrec_user -d revrec_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: revrec_redis
    restart: unless-stopped
    # Enables AOF persistence so BullMQ jobs survive a Redis restart.
    # In production, use Redis Cluster or Redis Sentinel.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - revrec_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Redis Commander (Dev UI) ──────────────────────────────────
  # Optional browser UI to inspect Redis keys and BullMQ queues.
  # Access at http://localhost:8081
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: revrec_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  revrec_postgres_data:
    driver: local
  revrec_redis_data:
    driver: local
