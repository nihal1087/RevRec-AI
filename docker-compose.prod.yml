# ══════════════════════════════════════════════════════════════════
# RevRec — Production Docker Compose
# Orchestrates PostgreSQL 16, Redis 7, Express API, and Nginx Web App.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# ══════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: revrec_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revrec_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revrec_pass}
      POSTGRES_DB: ${POSTGRES_DB:-revrec_db}
    volumes:
      - revrec_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revrec_user} -d ${POSTGRES_DB:-revrec_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & BullMQ Store ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: revrec_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - revrec_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Express API Backend & BullMQ Workers ──────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: revrec_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-revrec_user}:${POSTGRES_PASSWORD:-revrec_pass}@postgres:5432/${POSTGRES_DB:-revrec_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}   # H10 fix: never hardcode — set in .env or CI secrets
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── React Frontend Web App (Nginx) ───────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: revrec_prod_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  revrec_prod_pgdata:
    driver: local
  revrec_prod_redisdata:
    driver: local
