# ══════════════════════════════════════════════════════════════════
# RevRec — Production Docker Compose
# Orchestrates PostgreSQL 16, Redis 7, Express API, and Nginx Web App.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
# ══════════════════════════════════════════════════════════════════

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: revrec_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: revrec_user
      POSTGRES_PASSWORD: revrec_pass
      POSTGRES_DB: revrec_db
    ports:
      - "5432:5432"
    volumes:
      - revrec_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revrec_user -d revrec_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & BullMQ Store ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: revrec_prod_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - revrec_prod_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Express API Backend & BullMQ Workers ──────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: revrec_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://revrec_user:revrec_pass@postgres:5432/revrec_db?schema=public
      REDIS_URL: redis://redis:6379
      WEBHOOK_SECRET: whsec_revrec_test_secret_key_32bytes_minimum_length!
      GEMINI_API_KEY: ${GEMINI_API_KEY:-change_me_to_your_gemini_api_key}
      GEMINI_MODEL: gemini-1.5-flash
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── React Frontend Web App (Nginx) ───────────────────────────
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: revrec_prod_web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  revrec_prod_pgdata:
    driver: local
  revrec_prod_redisdata:
    driver: local
